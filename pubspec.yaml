name: duanju_app
description: 独立运行的多端短剧应用
publish_to: none
# 版本号规则（每出一个可安装包必须递增，禁止只动构件号或忘记 bump）：
# 1) 版本末位 +1，构件号（+N）同步无条件 +1；
# 2) 末位累计到 10 时向前进 1 位、末位归 0（3.0.10 -> 3.1.0；2.1.10 -> 2.2.0）；
#    中位累计到 10 时同理向首位进 1。
# 例：2.6.9+64 -> 2.6.10+65 -> 2.7.0+66
version: 2.6.7+62

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  video_player: ^2.9.2
  ffi: ^2.2.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  path_provider_platform_interface: ^2.1.3
  path_provider_windows: ^2.3.0
  shared_preferences: ^2.5.5
  # 直播播放时保持屏幕常亮（全剧TV 直播模块需要）。
  wakelock_plus: ^1.8.0
  shared_preferences_platform_interface: ^2.4.2
  shared_preferences_windows:
    path: packages/shared_preferences_windows
  flutter_foreground_task: 11.0.3
  ffmpeg_kit_flutter_new_min_gpl: 2.6.7
  file_picker: 13.1.0
  crypto: ^3.0.7
  window_manager: ^0.5.1
  package_info_plus: ^10.2.1
  dynamic_color: ^2.1.0
  url_launcher: ^6.3.3
  lpinyin: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  media_kit_libs_windows_video:
    path: packages/media_kit_libs_windows_video
  media_kit_video:
    path: packages/media_kit_video
  shared_preferences_windows:
    path: packages/shared_preferences_windows

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  # 噪点纹理资源（现已停用：质感改为高斯模糊 + 通透玻璃，不再铺雾面颗粒）。
  assets:
    - assets/textures/frost_dark.png
    - assets/textures/frost_light.png
