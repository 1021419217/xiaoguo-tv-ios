name: Build iOS IPA (小果影视)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  PYTHONUTF8: '1'
  # 与上游 guoapp 完全一致的 Bundle ID：安装即可覆盖官方包并保留数据。
  PACKAGE_NAME: com.guoapp.app

jobs:
  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Check Xcode / CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang
          if ! command -v pod >/dev/null 2>&1; then brew install cocoapods; fi
          pod --version
          go version
          flutter --version
          flutter precache --ios

      # 站源外置（2.0 模块化架构）：不注入任何内置模块，无需私有仓库密钥。
      # build_ios.py 内部依次完成 Go xcframework -> pod install ->
      # flutter build ios --release --no-codesign -> 打包未签名 IPA。
      - name: Build unsigned IPA
        run: python3 scripts/build_ios.py

      - name: 列出产物
        run: ls -lh dist/ios/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
